<style>

.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chip{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}

.pie{display:block;width:210px;max-width:70%;margin:6px auto 10px}

header{border:0;box-shadow:0 1px 0 var(--ln)}

input,select{border:0;background:var(--bg);border-radius:12px;padding:12px}

.mr>span:first-child{flex:1}
.it{cursor:pointer}
#t{z-index:40}
textarea{font:inherit;color:var(--tx);display:block;width:100%;margin-top:4px;padding:12px;border:0;background:var(--bg);border-radius:12px;resize:vertical}
@keyframes up{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov.an{animation:fade .18s}.ov.an .sheet{animation:up .24s ease-out}
button,.it,.mr,.tl,.tile{transition:transform .1s,opacity .1s}
button:active,.it:active,.mr:active,.tl:active{transform:scale(.97);opacity:.88}
body{font-variant-numeric:tabular-nums}
.tile{background:var(--cd);border-radius:16px;box-shadow:var(--sh);padding:12px}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.strip .chip{white-space:nowrap;flex:none}
.g{scroll-margin-top:112px}.tdy{box-shadow:0 0 0 2px var(--ac),var(--sh)}
.dlg{align-items:center;z-index:50}.dl{border-radius:20px;max-width:340px;margin:0 20px;padding:20px}.dl p{margin:0 0 14px}
#t{max-width:90vw;text-align:center}#t.s{pointer-events:auto}
.un{background:none;border:0;color:var(--ac);font-weight:700;margin-left:10px}

['trip','base','w','tx'].forEach(k=>delete S[k]);

 const own=true,cash=L.m=='cash',seen={},rec=[];[...z.tx].sort((a,b)=>b.id-a.id).forEach(t=>{const k=t.det.toLowerCase();if(!seen[k]&&rec.length<6){seen[k]=1;rec.push(t)}});
 const mc=[['debit',S.acc.debit],['credit',S.acc.credit],['cash','Cash']].map(([k,n])=>`<button class="chip ${L.m==k?'on':''}" onclick="L.m='${k}';tab()">${esc(n)}</button>`).join('');
