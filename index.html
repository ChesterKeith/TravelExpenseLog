<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">

<title>Wanderpurse</title>
<style>
:root{color-scheme:light;--bg:#fcf7f4;--cd:#fff;--tx:#1f2a30;--mu:#66757c;--ac:#61c0bf;--on:#0e3236;--ac2:#237f7c;--ln:#f0e6e1;--bad:#c0392b;--bar:#e4f2ef;--hd:#fff;--hx:#1f2a30;--sh:0 1px 2px rgba(60,40,30,.07),0 2px 8px rgba(60,40,30,.05)}
:root[data-theme=dark]{color-scheme:dark;--bg:#141b1f;--cd:#1d272c;--tx:#eaf1f2;--mu:#93a5ab;--ac:#61c0bf;--on:#0c2a2d;--ac2:#7fd6d4;--ln:#2c3a40;--bad:#ff8a80;--bar:#27413f;--hd:#1d272c;--hx:#eaf1f2;--sh:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{background:var(--hd);padding:10px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;gap:10px;max-width:640px;margin:auto}
.hb b{font-size:20px;letter-spacing:.3px;color:var(--hx);line-height:1}
.hb small{display:block;font-size:11px;color:var(--hx);opacity:.75;margin-top:3px}
.hb .x{margin-left:auto;font-size:20px}
.ht{display:flex;gap:8px;align-items:center;max-width:640px;margin:8px auto 0}
.ht select{margin:0;font-weight:700;background:var(--cd)}
.ht .x{font-size:22px;color:var(--hx)}
main{padding:8px 12px;max-width:640px;margin:auto}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input,select,button{font:inherit;color:var(--tx)}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:600}
.btn.sm{width:auto;padding:9px 14px;font-weight:500}
.mu{color:var(--mu);font-size:13px}
.it{display:flex;gap:8px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.it>div:first-child{flex:1;min-width:0}
.r{text-align:right}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid var(--ln)}
.li>span:first-child{flex:1;min-width:0}
.x{border:0;background:none;color:var(--mu);font-size:18px}
h3{margin:4px 0 6px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0;border:0;background:none;color:var(--mu);font-size:20px;display:flex;flex-direction:column;align-items:center;gap:1px;opacity:.65}
nav small{font-size:11px;font-weight:600}
nav .on{color:var(--ac2);opacity:1}
#t{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none}
#t.s{opacity:1}
.g{background:var(--cd);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px;background:var(--bar);font-weight:700}
.gh small{display:block;font-weight:400;font-size:11px;color:var(--mu)}
.g .it{border:0;border-radius:0;border-top:1px solid var(--ln);margin:0;background:none}
.pie{display:block;width:210px;max-width:70%;margin:6px auto 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
header{border:0;box-shadow:0 1px 0 var(--ln)}
.card,.g,.it{border:0;box-shadow:var(--sh);border-radius:16px}
.it{border-radius:14px}
.g .it{box-shadow:none;border-top:1px solid var(--ln);border-radius:0}
input,select{border:0;background:var(--bg);border-radius:12px;padding:12px}
input:focus,select:focus{outline:2px solid var(--ac)}
.ht select{background:var(--bg)}
.btn{border-radius:24px;padding:14px;letter-spacing:.2px}
.chip{border:0;background:var(--bg);padding:8px 14px}
.chip.on{background:var(--bar);color:var(--ac2);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--ac)}
h3{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin:2px 0 8px}
.gh{background:none;border-bottom:1px solid var(--ln)}
nav{border:0;box-shadow:0 -1px 0 var(--ln)}
nav button{opacity:1;font-size:inherit;padding:8px 0 10px}
nav i{width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav .on i{background:var(--bar)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<header id="h"></header><main id="v"></main>
<nav><button data-t="log" onclick="tab('log')"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i><small>Log</small></button><button data-t="list" onclick="tab('list')"><i><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></i><small>List</small></button><button data-t="plan" onclick="tab('plan')"><i><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg></i><small>Plan</small></button><button data-t="rep" onclick="tab('rep')"><i><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V5M19 20v-12"/></svg></i><small>Report</small></button><button data-t="set" onclick="tab('set')"><i><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></i><small>Setup</small></button></nav>
<div id="t"></div>
<script>
const $=s=>document.querySelector(s),K='tl1';
const mk=(name,base)=>({id:Date.now(),name,base,w:[],tx:[],budget:0,bp:[],start:'',end:'',pr:{},st:{}});
const D={owner:'',people:[],cats:['Food','Drink','Major Transpo','Minor Transpo','Activities','Shopping','Grocery','Accommodation','Pasabuy','Other'],acc:{debit:'Debit Card',credit:'Credit Card'},groups:[],ce:{},last:{m:'debit',c:'',p:[]},trips:[],cur:0};
let S;try{S={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){S={...D}}
if(!S.trips.length){const t=mk(S.trip||'My Trip',S.base||'PHP');t.w=S.w||[];t.tx=S.tx||[];S.trips=[t];S.cur=t.id}
['trip','base','w','tx'].forEach(k=>delete S[k]);
const Z=()=>S.trips.find(t=>t.id==S.cur)||S.trips[0],B=()=>Z().base;
let RM=false,MT;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Could not save: storage is full or blocked')}
 const z=Z();if(!RM&&z.cid&&window.FB&&window.CU&&CU.ok){clearTimeout(MT);MT=setTimeout(()=>FB.meta(z).catch(()=>{}),700)}};
const f=x=>x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dd=(x,y)=>Math.round((new Date(y)-new Date(x))/864e5);
const cu=()=>[...new Set([B(),...Z().w.map(x=>x.cur)])];
const rate=c=>{if(c==B())return 1;let p=0,q=0;Z().w.forEach(x=>{if(x.cur==c){p+=x.php;q+=x.fc}});return q?p/q:null};
const toast=m=>{const e=$('#t');e.textContent=m;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),1200)};
let T=S.owner?'log':'set',L=null,RV='cat';
const th=()=>{const d=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=d;document.querySelector('meta[name=theme-color]').content=d=='dark'?'#1d272c':'#ffffff';return d};
function tg(){S.theme=th()=='dark'?'light':'dark';save();tab()}
const CE={Food:'🍜',Drink:'🧋','Major Transpo':'✈️','Minor Transpo':'🛺',Activities:'🎡',Shopping:'🛍️',Grocery:'🛒',Accommodation:'🏨',Pasabuy:'📦',Other:'✨'};
const ce=c=>(S.ce&&S.ce[c])||CE[c]||'🏷️';
const PC=['#ff8f95','#61c0bf','#f9c784','#a3d9b1','#b8a9e8','#8cc7f0','#f4a6d7','#d9c27a','#7fb7a4','#e59866'];
const newL=()=>({k:'e',date:today(),det:'',amt:'',m:S.last.m,c:S.last.c||B(),cat:S.cats[0],by:S.owner,p:[...S.last.p],mode:'eq',ex:{},wl:'',wb:'',wc:'',wp:'',wf:''});
function tab(t){T=t||T;if(!L)L=newL();th();
 $('#h').innerHTML=`<div class="hb"><svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#61c0bf"/><path d="M11.4 14v-2.5a4.6 4.6 0 0 1 9.2 0V14" fill="none" stroke="#fae3d9" stroke-width="1.3" stroke-linecap="round"/><rect x="8.6" y="13.4" width="14.8" height="9.6" rx="2.2" fill="#fae3d9"/><circle cx="16" cy="17.3" r="1.75" fill="#ff8f95"/><path d="M14.4 18.1 16 21.3l1.6-3.2z" fill="#ff8f95"/><circle cx="16" cy="17.3" r=".65" fill="#fae3d9"/></svg><div><b>Wanderpurse</b><small>budget · split · forex</small></div><button class="x" onclick="tg()">${th()=='dark'?'☀️':'🌙'}</button></div><div class="ht"><select onchange="S.cur=+this.value;L=null;save();tab()">${S.trips.map(x=>`<option value="${x.id}" ${x.id==S.cur?'selected':''}>${x.cid?'☁ ':''}${esc(x.name)}</option>`).join('')}</select><button class="x" onclick="nt()">＋</button></div>`;
 $('#v').innerHTML={log:vLog,list:vList,plan:vPlan,rep:vRep,set:vSet}[T]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));upd()}
function nt(){const n=prompt('New trip name');if(!n)return;const t=mk(n,B());t.bp=S.owner?[S.owner]:[];S.trips.push(t);S.cur=t.id;L=null;save();tab('set')}
function dt(){const z=Z();if(S.trips.length<2)return alert('Keep at least one trip');
 if(z.cid){if(!(window.CU&&CU.ok&&z.owner==CU.email))return alert('Only the trip owner can delete a shared trip.');if(!confirm('Delete this trip for everyone?'))return;FB.kill(z.cid).catch(e=>alert(msg(e)))}
 else if(!confirm('Delete this trip and all its entries?'))return;
 S.trips=S.trips.filter(t=>t.id!=z.id);S.cur=S.trips[0].id;L=null;save();tab()}
function upd(){const e=$('#rem');if(!e)return;const a=+L.amt||0,k=L.p.length;
 if(L.mode=='eq'){e.textContent=k&&a?'Each: '+f(a/k):'';e.style.color=''}
 else{const d=Math.round((a-L.p.reduce((t,x)=>t+(+L.ex[x]||0),0))*100)/100;e.textContent=d==0?'Split matches the amount':'Left to assign: '+f(d);e.style.color=d==0?'':'var(--bad)'}}
function vLog(){
 if(!S.owner)return'<div class="card">Add your name in <b>Setup</b> first.</div>';
 const z=Z();L.p=L.p.filter(p=>S.people.includes(p));if(!S.people.includes(L.by))L.by=S.owner;if(!cu().includes(L.c))L.c=B();
 const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
 const kd=`<div class="chips"><button class="chip ${L.k=='e'?'on':''}" onclick="L.k='e';tab()">🧾 Expense</button><button class="chip ${L.k=='w'?'on':''}" onclick="L.k='w';tab()">🏧 Withdrawal</button></div>`;
 if(L.k=='w')return`<div class="card">${kd}
<label>Date<input type="date" value="${L.date}" oninput="L.date=this.value"></label>
<label>Label<input value="${esc(L.wl)}" placeholder="e.g. ATM at airport" oninput="L.wl=this.value"></label>
<label>Withdrawn by<select onchange="L.wb=this.value">${o(S.people,L.wb||S.owner)}</select></label>
<label>Foreign currency<input value="${esc(L.wc)}" placeholder="e.g. JPY" list="cl" oninput="L.wc=this.value"></label>
<datalist id="cl">${cu().filter(c=>c!=B()).map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>
<div class="two"><label>${esc(B())} paid (fees included)<input type="number" inputmode="decimal" step="any" value="${esc(L.wp)}" oninput="L.wp=this.value"></label>
<label>Foreign cash received<input type="number" inputmode="decimal" step="any" value="${esc(L.wf)}" oninput="L.wf=this.value"></label></div>
<div class="mu">This sets the rate for this trip: total ${esc(B())} paid ÷ total foreign cash received.</div><br>
<button class="btn" onclick="addW()">Save withdrawal</button></div>`;
 const own=true,cash=L.m=='cash';
 const mc=[['debit',S.acc.debit],['credit',S.acc.credit],['cash','Cash']].map(([k,n])=>`<button class="chip ${L.m==k?'on':''}" onclick="L.m='${k}';tab()">${esc(n)}</button>`).join('');
 const pc=S.people.map((p,i)=>`<button class="chip ${L.p.includes(p)?'on':''}" onclick="tp(${i})">${esc(p)}</button>`).join('');
 const gc=S.groups.map((g,i)=>`<button class="chip" onclick="gp(${i})">${esc(g.n)}</button>`).join('');
 const ex=L.mode=='ex'?L.p.map(p=>{const i=S.people.indexOf(p);return`<label>${esc(p)}<input type="number" inputmode="decimal" step="any" value="${esc(L.ex[p]||'')}" oninput="L.ex[S.people[${i}]]=this.value;upd()"></label>`}).join(''):'';
 return`<div class="card">${kd}
<label>Date<input type="date" value="${L.date}" oninput="L.date=this.value"></label>
<label>Details<input value="${esc(L.det)}" placeholder="e.g. Banh mi" oninput="L.det=this.value"></label>
<div class="two"><label>Amount<input type="number" inputmode="decimal" step="any" value="${esc(L.amt)}" oninput="L.amt=this.value;upd()"></label>
<label>Currency<select ${cash?'':'disabled'} onchange="L.c=this.value">${o(cu(),cash?L.c:B())}</select></label></div>
<label>Paid by<select onchange="L.by=this.value;tab()">${o(S.people,L.by)}</select></label>
${own?`<div class="mu">Paid with</div><div class="chips">${mc}</div>`:''}
<label>Category<select onchange="L.cat=this.value">${S.cats.map(c=>`<option value="${esc(c)}" ${c==L.cat?'selected':''}>${ce(c)} ${esc(c)}</option>`).join('')}</select></label>
<div class="mu">Shared by</div><div class="chips">${pc}</div>
<div class="chips">${gc}<button class="chip" onclick="L.p=[...S.people];tab()">Everyone</button><button class="chip" onclick="sg()">+ Save group</button></div>
<div class="chips"><button class="chip ${L.mode=='eq'?'on':''}" onclick="L.mode='eq';tab()">Split equally</button><button class="chip ${L.mode=='ex'?'on':''}" onclick="L.mode='ex';tab()">Set amounts</button></div>
${ex}<div class="mu" id="rem"></div><br><button class="btn" onclick="add()">Save</button></div>`}
function tp(i){const p=S.people[i],j=L.p.indexOf(p);j<0?L.p.push(p):L.p.splice(j,1);tab()}
function gp(i){L.p=S.groups[i].p.filter(p=>S.people.includes(p));tab()}
function sg(){const n=prompt('Group name');if(n&&L.p.length){S.groups.push({n,p:[...L.p]});save();tab()}}
function add(){if(!okc())return;
 const a=+L.amt;if(!(a>0))return alert('Enter an amount');
 if(!L.p.length)return alert('Pick who shares this');
 const cash=L.m=='cash',cur=cash?L.c:B();
 let sh;
 if(L.mode=='eq')sh=L.p.map(p=>({p,a:a/L.p.length}));
 else{sh=L.p.map(p=>({p,a:+L.ex[p]||0}));if(Math.abs(sh.reduce((t,x)=>t+x.a,0)-a)>.005)return alert('The split must add up to the amount')}
 const t={id:Date.now(),date:L.date,det:L.det||L.cat,cat:L.cat,cur,amt:a,by:L.by,m:L.m,sh};Z().tx.push(t);cw('tx',t);
 S.last={m:L.m,c:L.c,p:L.p};save();const d=L.date;L=newL();L.date=d;tab('log');toast('Saved')}
function addW(){if(!okc())return;const cur=(L.wc||'').trim().toUpperCase(),php=+L.wp,fc=+L.wf;
 if(!cur||cur==B()||!(php>0)||!(fc>0))return alert(`Enter a foreign currency code (not ${B()}), the ${B()} paid and the foreign cash received`);
 const w={id:Date.now(),date:L.date,label:L.wl,who:L.wb||S.owner,cur,php,fc};Z().w.push(w);cw('w',w);S.last.m='cash';S.last.c=cur;save();const d=L.date;L=newL();L.date=d;tab('log');toast('Saved')}
const ml=t=>(t.by==S.owner?'':t.by+' · ')+(t.m=='debit'?(t.by==S.owner?S.acc.debit:'Debit'):t.m=='credit'?(t.by==S.owner?S.acc.credit:'Credit'):'Cash');
function agg(){const o={tot:0,per:{},paid:{},cat:{},pay:{},day:{}};
 Z().tx.forEach(t=>{const r=rate(t.cur)||0,v=t.amt*r;o.tot+=v;o.paid[t.by]=(o.paid[t.by]||0)+v;
  t.sh.forEach(x=>o.per[x.p]=(o.per[x.p]||0)+x.a*r);
  o.cat[t.cat]=(o.cat[t.cat]||0)+v;
  const m=ml(t)+(t.m=='cash'&&t.cur!=B()?' '+t.cur:'');
  o.pay[m]=(o.pay[m]||0)+v;o.day[t.date]=(o.day[t.date]||0)+v});
 return o}
function vList(){
 const z=Z(),b=esc(B()),a=agg();
 const it=[...z.tx.map(t=>({...t,k:'e'})),...z.w.map(w=>({...w,k:'w'}))].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
 const dt={},cum={};z.tx.forEach(t=>dt[t.date]=(dt[t.date]||0)+t.amt*(rate(t.cur)||0));
 const ds=[...new Set(it.map(t=>t.date))].sort();let run=0;ds.forEach(d=>{run+=dt[d]||0;cum[d]=run});
 const row=t=>{if(t.k=='w')return`<div class="it"><div><b>🏧 ${esc(t.label||'Withdrawal')}</b><div class="mu">${esc(t.who||S.owner)} · 1 ${esc(t.cur)} = ${(t.php/t.fc).toFixed(4)} ${b}</div></div><div class="r"><b>${f(t.fc)} ${esc(t.cur)}</b><div class="mu">${f(t.php)} ${b}</div></div><button class="x" onclick="delW(${t.id})">✕</button></div>`;
  const r=rate(t.cur)||0;return`<div class="it"><div><b>${ce(t.cat)} ${esc(t.det)}</b><div class="mu">${esc(t.cat)} · ${esc(ml(t))}</div><div class="mu">${t.sh.map(x=>esc(x.p)+' '+f(x.a)).join(' · ')}</div></div><div class="r"><b>${f(t.amt)} ${esc(t.cur)}</b>${t.cur!=B()?`<div class="mu">${f(t.amt*r)} ${b}</div>`:''}</div><button class="x" onclick="del(${t.id})">✕</button></div>`};
 let h=`<div class="card"><div class="mu">Total paid</div><b>${f(a.tot)} ${b}</b><div class="mu" style="margin-top:6px">${Object.entries(a.per).map(([p,v])=>esc(p)+' '+f(v)).join(' · ')}</div></div>`;
 ds.slice().reverse().forEach(d=>{const e=it.filter(t=>t.date==d);
  h+=`<div class="g"><div class="gh"><span>${new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}<small>${z.start?'Day '+(dd(z.start,d)+1)+' · ':''}${e.length} ${e.length==1?'entry':'entries'}</small></span><span style="text-align:right">${f(dt[d]||0)} ${b}<small>Trip total ${f(cum[d])} ${b}</small></span></div>${e.map(row).join('')}</div>`});
 return h+(it.length?'':'<div class="mu">No entries yet.</div>')}
function del(id){if(!okc())return;if(confirm('Delete this entry?')){Z().tx=Z().tx.filter(t=>t.id!=id);cd('tx',id);save();tab()}}
function delW(id){if(!okc())return;const z=Z(),n=z.w.filter(x=>x.id!=id);
 if(z.tx.some(t=>t.cur!=z.base&&!n.some(x=>x.cur==t.cur)))return alert('Entries still use that currency, so the withdrawal stays');
 if(confirm('Delete this withdrawal?')){z.w=n;cd('w',id);save();tab()}}
function tb(i){const z=Z(),p=S.people[i],j=z.bp.indexOf(p);j<0?z.bp.push(p):z.bp.splice(j,1);save();tab()}
let P=null;
const newP=()=>({date:Z().start||today(),time:'',title:'',place:'',url:'',cat:S.cats.includes('Activities')?'Activities':S.cats[0],est:''});
function vPlan(){

 signup:async(e,p)=>{const c=await A.createUserWithEmailAndPassword(au,e,p);await A.sendEmailVerification(c.user)},
 resend:()=>A.sendEmailVerification(au.currentUser),
 reset:e=>A.sendPasswordResetEmail(au,e),

 meta:z=>F.setDoc(F.doc(db,'trips',z.cid),meta(z),{merge:true}),

 kill:c=>F.deleteDoc(F.doc(db,'trips',c)),
 share:async z=>{await au.currentUser.getIdToken(true);const me=au.currentUser.email,r=F.doc(F.collection(db,'trips'));z.cid=r.id;z.owner=me;z.members=[me];
  try{await F.setDoc(r,{...meta(z),owner:me,members:[me]});

   for(let i=0;i<all.length;i+=400){const b=F.writeBatch(db);all.slice(i,i+400).forEach(([k,o])=>b.set(ref(r.id,k,o.id),o));await b.commit()}
   save()}catch(e){delete z.cid;throw e}}
};
